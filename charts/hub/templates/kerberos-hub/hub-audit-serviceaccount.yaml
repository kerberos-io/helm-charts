{{- if and .Values.audit.enabled (default dict .Values.kerberoshub.audit.serviceAccount).create }}
{{- $serviceAccount := .Values.kerberoshub.audit.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "hub-audit" $serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $serviceAccount.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
