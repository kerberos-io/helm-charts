{{- /*
vault-forwarder images must come from a hardened release: they carry the signed
image-hardening attestation (result "passed") that the UUG.AI release workflow
adds after all hardening gates pass, for uug-ai/vault-forwarder.
The signature itself is checked by vault-forwarder-signed-images.yaml.
A namespaced Policy, so it applies only to the release namespace.
Rendered only when imageHardening.enabled is true and Kyverno is installed.
*/ -}}
{{- if and .Values.imageHardening.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: vault-forwarder-hardened-images
  annotations:
    policies.kyverno.io/title: vault-forwarder images must come from a hardened UUG.AI release
    policies.kyverno.io/category: Image hardening
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
# Kyverno defaults apply: background scans of running pods, attestation required.
# Only settings whose Kyverno default would change behaviour are set below.
spec:
  # Not hardened yet: uug-ai/vault-forwarder has no hardened release with the
  # image-hardening attestation (the image does not meet the hardened contract
  # yet). This policy reports that gap and stays in Audit, even when
  # imageHardening.validationFailureAction is Enforce. Once its releases are
  # hardened, use the same line as hub-api-hardened-images.yaml.
  validationFailureAction: Audit
  # Kyverno's default (Fail) would stop vault-forwarder pods starting while Kyverno is down.
  failurePolicy: Ignore
  # Verifying against GHCR and Rekor can exceed the 10s default.
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-vault-forwarder-hardened
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "kerberos/vault-forwarder:*"
            - "kerberos/vault-forwarder@*"
            - "docker.io/kerberos/vault-forwarder:*"
            - "docker.io/kerberos/vault-forwarder@*"
            - "ghcr.io/uug-ai/vault-forwarder:*"
            - "ghcr.io/uug-ai/vault-forwarder@*"
          # Kyverno's defaults (true) would rewrite pod images to digests and
          # report every tag-based image; enable together with Enforce.
          mutateDigest: false
          verifyDigest: false
          attestations:
            - type: https://github.com/uug-ai/workflows/attestations/image-hardening/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        # The UUG.AI release workflow, at a branch/tag ref or a commit.
                        subjectRegExp: '^https://github\.com/uug-ai/workflows/\.github/workflows/release-create\.yml@(refs/.+|[0-9a-f]{40})$'
                        additionalExtensions:
                          githubWorkflowRepository: uug-ai/vault-forwarder
                        rekor:
                          url: https://rekor.sigstore.dev
              # Fields of the attestation's predicate. {{`{{ ... }}`}} is Kyverno
              # syntax, escaped so Helm leaves it alone.
              conditions:
                - all:
                    - key: "{{`{{ result }}`}}"
                      operator: Equals
                      value: passed
                    - key: "{{`{{ repository }}`}}"
                      operator: Equals
                      value: uug-ai/vault-forwarder
{{- end }}
