{{- /*
hub-api images must be signed by UUG.AI: a keyless cosign signature issued by
GitHub Actions, made by the UUG.AI release workflow, for uug-ai/hub-api.
A namespaced Policy, so it applies only to the release namespace.
Rendered only when Kyverno is installed. Values: imageVerification.policies.hubApi.
*/ -}}
{{- $policy := .Values.imageVerification.policies.hubApi }}
{{- if and .Values.imageVerification.enabled $policy.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: hub-api-signed-images
  annotations:
    policies.kyverno.io/title: hub-api images must be signed by UUG.AI
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: {{ $policy.validationFailureAction }}
  failurePolicy: {{ $policy.failurePolicy }}
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-hub-api
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/uug-ai/hub-api:*"
            - "ghcr.io/uug-ai/hub-api@*"
          required: true
          mutateDigest: {{ $policy.mutateDigest }}
          verifyDigest: {{ $policy.mutateDigest }}
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    # The UUG.AI release workflow, at a branch/tag ref or a commit.
                    subjectRegExp: '^https://github\.com/uug-ai/workflows/\.github/workflows/release-create\.yml@(refs/.+|[0-9a-f]{40})$'
                    additionalExtensions:
                      # That workflow signs for every UUG.AI repository; this
                      # binds the signature to hub-api's own repository.
                      githubWorkflowRepository: uug-ai/hub-api
                    rekor:
                      url: https://rekor.sigstore.dev
{{- end }}
