{{- /*
UUG.AI images are trusted only from ghcr.io/uug-ai: report a container, init
container or ephemeral container image that is a UUG.AI image (uugai/... on
Docker Hub, or any registry's uugai/ or uug-ai/ organisation) pulled from
anywhere else. Other images in the namespace (agents, cert-manager solvers,
third-party tools) are not the chart's to vouch for and are ignored. Signature
and hardening are checked per image by the *-signed-images / *-hardened-images
policies, which match ghcr.io/uug-ai images only.
A namespaced Policy, so it applies only to the release namespace.
Rendered only when imageVerification.enabled is true and Kyverno is installed.
*/ -}}
{{- if and .Values.imageVerification.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: trusted-registry
  annotations:
    policies.kyverno.io/title: UUG.AI images must come from ghcr.io/uug-ai
    policies.kyverno.io/category: Image registry
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  # Reports UUG.AI images from other registries without blocking them, even
  # when imageVerification.validationFailureAction is Enforce.
  validationFailureAction: Audit
  # Kyverno's default (Fail) would stop pods starting while Kyverno is down.
  failurePolicy: Ignore
  rules:
    - name: images-from-ghcr-uug-ai
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "UUG.AI images must come from the trusted registry ghcr.io/uug-ai/."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                all:
                  # A UUG.AI image: Docker Hub uugai/..., or a uugai/ or uug-ai/
                  # organisation on any registry ...
                  - key: "{{`{{ element.image }}`}}"
                    operator: AnyIn
                    value:
                      - "uugai/*"
                      - "*/uugai/*"
                      - "*/uug-ai/*"
                  # ... that is not pulled from ghcr.io/uug-ai.
                  - key: "{{`{{ element.image }}`}}"
                    operator: NotEquals
                    value: "ghcr.io/uug-ai/*"
{{- end }}
