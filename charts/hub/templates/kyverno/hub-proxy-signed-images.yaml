{{- /*
hub-proxy images must be signed by UUG.AI: a keyless cosign signature issued by
GitHub Actions, made by the UUG.AI release workflow, for uug-ai/hub-proxy.
A namespaced Policy, so it applies only to the release namespace.
Rendered only when imageVerification.enabled is true and Kyverno is installed.
*/ -}}
{{- if and .Values.imageVerification.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: hub-proxy-signed-images
  annotations:
    policies.kyverno.io/title: hub-proxy images must be signed by UUG.AI
    policies.kyverno.io/category: Image signing
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
# Kyverno defaults apply: background scans of running pods, signature required.
# Only settings whose Kyverno default would change behaviour are set below.
spec:
  # Not signed by UUG.AI yet. The chart pulls Docker Hub uugai/hub-proxy (vault-proxy), which the UUG.AI
  # release workflow does not sign. uug-ai/hub-proxy releases ghcr.io/uug-ai/hub-proxy
  # through the shared workflow: switch the chart to that image and sign its releases.
  # This policy reports that gap and stays in Audit, even when
  # imageVerification.validationFailureAction is Enforce.
  validationFailureAction: Audit
  # Kyverno's default (Fail) would stop hub-proxy pods starting while Kyverno is down.
  failurePolicy: Ignore
  # Verifying against GHCR and Rekor can exceed the 10s default.
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-hub-proxy
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "uugai/hub-proxy:*"
            - "uugai/hub-proxy@*"
            - "docker.io/uugai/hub-proxy:*"
            - "docker.io/uugai/hub-proxy@*"
            - "ghcr.io/uug-ai/hub-proxy:*"
            - "ghcr.io/uug-ai/hub-proxy@*"
          # Kyverno's defaults (true) would rewrite pod images to digests and
          # report every tag-based image; enable together with Enforce.
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    # The UUG.AI release workflow, at a branch/tag ref or a commit.
                    subjectRegExp: '^https://github\.com/uug-ai/workflows/\.github/workflows/release-create\.yml@(refs/.+|[0-9a-f]{40})$'
                    additionalExtensions:
                      # That workflow signs for every UUG.AI repository; this
                      # binds the signature to uug-ai/hub-proxy.
                      githubWorkflowRepository: uug-ai/hub-proxy
                    rekor:
                      url: https://rekor.sigstore.dev
{{- end }}
