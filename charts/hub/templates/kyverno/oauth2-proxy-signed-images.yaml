{{- /*
oauth2-proxy images must be signed by UUG.AI: a keyless cosign signature issued by
GitHub Actions, made by the UUG.AI release workflow, for uug-ai/oauth2-proxy.
A namespaced Policy, so it applies only to the release namespace.
Rendered only when imageVerification.enabled is true and Kyverno is installed.
*/ -}}
{{- if and .Values.imageVerification.enabled (.Capabilities.APIVersions.Has "kyverno.io/v1") }}
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: oauth2-proxy-signed-images
  annotations:
    policies.kyverno.io/title: oauth2-proxy images must be signed by UUG.AI
    policies.kyverno.io/category: Image signing
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
# Kyverno defaults apply: background scans of running pods, signature required.
# Only settings whose Kyverno default would change behaviour are set below.
spec:
  # Not signed by UUG.AI yet. Third-party image (quay.io/oauth2-proxy/oauth2-proxy), not built by UUG.AI, so
  # this signer can never match: the policy only makes the unverified image visible.
  # To verify it, check the upstream project's own signing identity instead, and pin
  # the image to a version or digest rather than :latest.
  # This policy reports that gap and stays in Audit, even when
  # imageVerification.validationFailureAction is Enforce.
  validationFailureAction: Audit
  # Kyverno's default (Fail) would stop oauth2-proxy pods starting while Kyverno is down.
  failurePolicy: Ignore
  # Verifying against GHCR and Rekor can exceed the 10s default.
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-oauth2-proxy
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "quay.io/oauth2-proxy/oauth2-proxy:*"
            - "quay.io/oauth2-proxy/oauth2-proxy@*"
          # Kyverno's defaults (true) would rewrite pod images to digests and
          # report every tag-based image; enable together with Enforce.
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    # The UUG.AI release workflow, at a branch/tag ref or a commit.
                    subjectRegExp: '^https://github\.com/uug-ai/workflows/\.github/workflows/release-create\.yml@(refs/.+|[0-9a-f]{40})$'
                    additionalExtensions:
                      # That workflow signs for every UUG.AI repository; this
                      # binds the signature to uug-ai/oauth2-proxy.
                      githubWorkflowRepository: uug-ai/oauth2-proxy
                    rekor:
                      url: https://rekor.sigstore.dev
{{- end }}
